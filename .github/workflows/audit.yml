name: Security and regression checks
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo install cargo-audit --locked
      # Neither package is compiled for our supported server targets. SQLx keeps
      # optional MySQL RSA dependencies in Cargo.lock; atomic-polyfill is for
      # embedded AVR/ARM targets. Assert the deployment graph before exempting.
      - run: python3 scripts/check-dependency-exposure.py
      - run: cargo audit --deny unmaintained --deny unsound --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2023-0089
