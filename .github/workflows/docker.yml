name: Self-hosted image verification
on: [push, pull_request]
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cipherpay:audit
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root startup and SQLite migrations
        run: >-
          docker run --rm --entrypoint sh cipherpay:audit -c
          'test "$(id -u)" = 10001 && DATABASE_URL=sqlite:/data/check.db cipherpay --check-database'
