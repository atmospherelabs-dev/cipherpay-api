[package]
name = "cipherpay"
version = "0.1.0"
edition = "2021"
description = "Shielded Zcash payment service with mempool detection"
license = "MIT"

[dependencies]
# Web framework
# No compress-* features: the server uses no Compress middleware, but those
# features auto-decode zstd/brotli/gzip request bodies (zstd-safe 7,
# RUSTSEC-2026-0391..0410). http2 stays off (plain HTTP behind Caddy).
actix-web = { version = "4", default-features = false, features = ["macros", "cookies"] }
actix-cors = "0.7"
actix-web-lab = "0.24"
actix-governor = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database (SQLite for local dev, Postgres for production)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for ZecBlock API + webhooks)
reqwest = { version = "0.12", features = ["json"] }

# WebSocket client (for ZecBlock real-time mempool push)
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# Zcash crates (NU7 / consensus branch 0x77190AD9, Ironwood support)
# Zakura Common: performance-optimized forks of librustzcash (1.5x trial decryption,
# 21x Sinsemilla). Same APIs, lib names unchanged — `use zcash_primitives::...` and
# `use orchard::...` still work. Keep every Zcash crate on the same Zakura release so
# BranchId, NetworkType and note-encryption traits are one set of types; mixing in
# upstream zcash_protocol/zcash_address/zcash_note_encryption breaks that.
zcash_primitives = { package = "zakura-primitives", version = "5.2.0", default-features = false }
zcash_note_encryption = { package = "zakura-note-encryption", version = "5.2.0" }
orchard = { package = "zakura-orchard", version = "5.2.0", default-features = false, features = ["std", "backend-halo2", "zip32-addresses"] }
zcash_address = { package = "zakura-address", version = "5.2.0" }
zcash_protocol = { package = "zakura-protocol", version = "5.2.0" }

# WebAuthn / Passkeys
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

# Crypto / hashing
sha2 = "0.10"
sha3 = "0.10"
bs58 = "0.5"
bech32 = "0.11"
ed25519-dalek = "2"
serde_json_canonicalizer = "0.3"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
subtle = "2"

# QR code generation
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Concurrency
futures = "0.3"

# Email (via Resend HTTP API — no SMTP needed, avoids cloud provider port blocks)

# URL parsing
url = "2"

# Misc
anyhow = "1"
thiserror = "2"
aes-gcm = "0.10.3"

[dev-dependencies]
actix-rt = "2"
